<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Involved | Sizo Community Restoration Projects</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Sizo Community Restoration Projects</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="services.html">Services</a>
            <a href="inquiry.html">Get Involved</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Get Involved</h2>

        <p>
            There are different ways you can support Sizo,
            including volunteering, sponsorship and donations.
        </p>

        <form>
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <label for="interest">How would you like to help?</label>
            <select id="interest" name="interest">
                <option value="volunteer">Volunteer</option>
                <option value="sponsor">Sponsor</option>
                <option value="donate">Donate</option>
            </select>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5"></textarea>

            <button type="submit">Submit Inquiry</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Sizo Community Restoration Projects</p>
    </footer>

</body>
</html>
